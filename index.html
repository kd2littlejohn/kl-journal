<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0c0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KL Journal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<title>KL Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* VOICE: quiet and personal, like a leather-bound journal.
   IDEA: the KL cover: black grain leather, gold foil monogram, gold stitching.
   PICTURE: the writing page itself, gold-ruled on black, with the KL monogram in the header.
   COLOUR and TYPE: near-black leather, warm ivory ink, one gold accent; Cinzel for titles, Lora for writing, Inter for controls.
   LAYOUT: one column up to 760px, sticky header with a stitched gold edge, bottom tab bar. */
:root{color-scheme:dark;
 --bg:#0d0c0b;--card:#171513;--ink:#efe7d6;--mute:#a69d8b;--line:#2e2a25;--soft:#1f1c18;
 --acc:#d6ab4f;--acc2:#f0cf7a;--acc-ink:#191206;--acc-soft:rgba(214,171,79,.13);--ok:#9fcf8f}
*{box-sizing:border-box;min-width:0}
html{background:#0d0c0b}body{margin:0;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;padding-bottom:150px}
h1,h2{font-family:Lora,Georgia,serif;font-weight:600;line-height:1.1;margin:0}
h1{font-family:Cinzel,Lora,serif;font-weight:600;letter-spacing:.06em;font-size:clamp(24px,5.5vw,30px);color:var(--acc2)}h2{font-size:21px;margin:0 0 10px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top);border-bottom:0}
body.has-hero header{background:transparent}body.has-hero header.solid{background:var(--bg)}
body.has-hero header .ib{background:rgba(13,12,11,.42);border-color:rgba(212,175,97,.22);color:#f5ecd8}
body.has-hero header .bar small{color:#cfc4ae}body.has-hero header:not(.solid) .mono,body.has-hero header:not(.solid) .t{visibility:hidden}
.mono{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--acc);display:grid;place-items:center;font-family:Cinzel,serif;font-weight:600;font-size:16px;color:var(--acc2);flex:none}
.bar{display:flex;align-items:center;gap:8px;padding:10px 0}.wrap.bar{padding:10px 16px}
.bar .t{flex:1}.bar small{display:block;color:var(--mute);font-size:13px}
.status{font-size:11px;line-height:1.4;color:var(--mute);opacity:.55;text-align:center;white-space:nowrap;padding:18px 0 4px}.status.warn{opacity:1;color:#e0574b}
.status.warn{color:var(--acc)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;line-height:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.lbl{font-size:13px;color:var(--mute);font-weight:600;display:block;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;min-width:44px;padding:0 12px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px}
.chip.sm{min-width:36px;padding:0 8px;min-height:40px}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chip,.btn,.ib,.tick{color:var(--ink)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
input,textarea,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:#100f0d;color-scheme:dark;padding:9px 11px;font-size:16px}
textarea{min-height:72px;resize:vertical}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.anchor{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.anchor:first-of-type{border-top:0}
.anchor b{font-size:16px}.anchor .hint{font-size:12px;color:var(--mute);display:block;font-weight:400}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{min-height:44px;border:0;background:var(--card);font-weight:600;font-size:14px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--acc-ink)}
.anchor input{grid-column:1/-1}
.score{display:flex;align-items:baseline;gap:10px;margin-top:4px}
.score .big{font-family:Lora,serif;font-size:40px;line-height:1;color:var(--acc)}
.ex{display:grid;grid-template-columns:minmax(0,1fr) 92px 80px 44px;gap:6px;margin-bottom:6px}
.ex button{border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:18px;color:var(--mute)}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn:hover,.chip:hover,.ib:hover{border-color:rgba(214,171,79,.6)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pace{font-size:14px;color:var(--mute);margin-top:6px}
.q{font-weight:600;font-size:15px;margin:12px 0 6px}
.q:first-of-type{margin-top:0}
.rem{font-size:15px;color:var(--acc);text-align:center;margin:18px 0 6px;font-style:italic;font-family:Lora,serif}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#0f0e0c;border-top:1px dashed rgba(214,171,79,.4);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{min-height:60px;border:0;background:none;font-size:13px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current=page]{color:var(--acc)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.grid7{display:grid;grid-template-columns:92px repeat(7,minmax(0,1fr));gap:4px;align-items:center;font-size:14px}
.grid7 .h{text-align:center;font-size:12px;color:var(--mute);font-weight:600}
.grid7 .h button{border:0;background:none;color:inherit;font:inherit;min-height:36px;width:100%}
.dot{width:22px;height:22px;border-radius:50%;margin:auto;border:1.5px solid var(--line)}
.dot.l1{border-color:var(--acc);background:var(--acc-soft)}
.dot.l2{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 55%,transparent)}
.dot.l3{border-color:var(--acc);background:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:10px}
.stat{background:var(--soft);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-family:Lora,serif;color:var(--acc2)}
.stat span{font-size:13px;color:var(--mute)}
.bars .r{display:grid;grid-template-columns:72px 1fr 44px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.bars .tr{height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.bars .fl{height:100%;background:var(--acc);border-radius:7px}
.fig{position:relative;min-height:200px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.empty{color:var(--mute);font-size:15px;padding:8px 0}
.note{background:var(--acc-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:12px 0}
.ms{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:8px;align-items:center;margin-bottom:8px}
.ms label{display:flex;gap:10px;align-items:center;font-size:15px}
.ms input[type=checkbox]{width:22px;height:22px;min-height:0}
.hide{display:none!important}
.planhd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.planhd .chips{gap:4px}
.top,.task{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;gap:4px;border-top:1px solid var(--line)}
.task{grid-template-columns:44px minmax(0,1fr) 36px;padding:2px 0}
.task .tk{display:flex;flex-direction:column;min-width:0}
.top:first-of-type{border-top:0}
.top input,.top textarea,.task .tt{border:0;background:transparent;min-height:44px;padding:6px 4px;font-size:16px}
textarea.awrap{resize:none;overflow:hidden;min-height:44px;line-height:1.4;display:block;word-break:break-word}
.task .tt,.top textarea{min-height:44px;padding-top:11px}
textarea.jtitle{min-height:0;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 0}
.task .td{min-height:30px;padding:0 4px 4px;font-size:13px;color:var(--mute);border:0;background:transparent;width:auto;align-self:flex-start}
.task .td:not([value]),.task .td[value='']{opacity:.6}
.cb{width:44px;height:44px;border:0;background:none;display:grid;place-items:center}
.cb span{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--mute);display:grid;place-items:center;font-size:13px}
.done .cb span{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.done .tt,.top.done input,.top.done textarea,.blk.done input[data-bf=t]{text-decoration:line-through;color:var(--mute)}
.task.over .td{color:#e0574b}
.x{border:0;background:none;color:var(--mute);font-size:20px;min-height:40px;min-width:32px}
.blk{display:grid;grid-template-columns:86px minmax(0,1fr) 40px 40px 30px;gap:4px;align-items:center;border-top:1px solid var(--line);padding:3px 0}
.blk:first-of-type{border-top:0}
.blk input{min-height:40px;padding:6px;font-size:15px}
.blk input[type=time]::-webkit-calendar-picker-indicator{display:none}
.blk input[type=time]{padding:6px 4px;text-align:center}
.blk input[type=time]{color:var(--acc2);font-variant-numeric:tabular-nums}
.ib2{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--acc2);display:grid;place-items:center;padding:0}
.ib2 svg{width:20px;height:20px}
.ib2.on{border-color:var(--acc);background:var(--acc)}.ib2.on svg{stroke:var(--acc-ink)}
.blk.evr .etm{color:var(--acc2);font-variant-numeric:tabular-nums;font-size:14px;text-align:center;white-space:nowrap}
.blk.evr .et{font-size:15px;overflow-wrap:anywhere;padding:6px 2px}.blk.evr .et small{display:block;font-size:12px;color:var(--mute)}
.blk.evr .src{display:grid;place-items:center;color:var(--mute)}.blk.evr .src svg{width:18px;height:18px}
.blk.evr.done .et{text-decoration:line-through;color:var(--mute)}
.blk.flex{grid-template-columns:34px minmax(0,1fr) 40px 40px 30px}
.wsel{position:relative;width:34px;height:40px;display:grid;place-items:center;color:var(--mute)}.wsel svg{width:18px;height:18px}
.wsel select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.blk.evr.flex{grid-template-columns:minmax(0,1fr) 40px 40px 30px}
.blk select{min-height:40px;padding:4px 6px;font-size:13px;color:var(--acc2);background:#100f0d;border:1px solid var(--line);border-radius:10px}
.blk .bl{display:flex;flex-direction:column;min-width:0}.blk .bl small{font-size:12px;color:var(--acc2);padding:0 6px 4px}
.blk.flex.evr .et{padding-left:6px}.blk.flex.evr .et b{color:var(--acc2);font-weight:600;font-variant-numeric:tabular-nums;margin-right:6px}
.lnk{border:0;background:none;color:var(--acc2);text-decoration:underline;font-size:12px;padding:0;min-height:24px}
.bnote textarea{min-height:110px;font-family:Lora,Georgia,serif;font-size:16px;line-height:1.6}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:4px;border-top:1px solid var(--line);padding:2px 0}
.srow:first-of-type{border-top:0}.srow .st{font-size:16px;padding:8px 2px;overflow-wrap:anywhere}.srow .st small{display:block;font-size:12px;color:var(--acc2)}
.srow .sw{font-size:12px;color:var(--mute);white-space:nowrap;padding-right:4px}
.srow.done .st{color:var(--mute)}.srow.done .st>span{text-decoration:line-through}
.bigread{font-family:Lora,Georgia,serif;font-size:26px;line-height:1.15;color:var(--acc2);margin:6px 0 10px}
.bigread small{display:block;font-family:Inter;font-size:13px;color:var(--mute);margin-bottom:4px}
.note{border-top:1px solid var(--line);padding:12px 0}.note:first-of-type{border-top:0}
.note .nh{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--mute);margin-bottom:4px}
.note .nr{font-family:Lora,serif;font-size:17px;color:var(--ink);display:block;margin-bottom:4px}
.note p{margin:0;white-space:pre-wrap;font-size:15px;line-height:1.55}
.note button.nbody{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:0}
.nform textarea.awrap{min-height:0}.nform textarea{min-height:150px;font-family:Lora,Georgia,serif;font-size:16px;line-height:1.6}
.pod{font-size:12px;font-weight:700;color:var(--acc);margin:12px 0 2px;letter-spacing:.02em}
.pod:first-child{margin-top:4px}
.alld{font-size:14px;color:var(--mute);margin:2px 0 6px}.alld b{color:var(--acc2);font-weight:600}
.prog{display:flex;align-items:center;gap:10px;margin:14px 0 4px}.prog .pbar{flex:1;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}.prog .pbar i{display:block;height:100%;background:var(--acc)}
.prog span{font-size:13px;color:var(--mute);white-space:nowrap}
.schedhd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}.schedhd small{font-size:12px;color:var(--mute)}
.overhd{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#e0a14b;font-size:14px;font-weight:600;margin:4px 0}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
.seg3 button{min-height:44px;border:0;background:var(--card);color:var(--ink);font-weight:600;border-left:1px solid var(--line)}
.seg3 button:first-child{border-left:0}
.seg3 button[aria-pressed=true]{background:var(--acc);color:var(--acc-ink)}
.grp{font-size:13px;font-weight:700;color:var(--acc);margin:14px 0 2px;text-transform:none}
.grp:first-of-type{margin-top:4px}
.wkrow{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);padding:12px 0}
.wkrow:first-of-type{border-top:0}
.wkrow.now .wd b{color:var(--acc2)}
.wd b{display:block;font-family:Lora,serif;font-size:17px}.wd span{font-size:13px;color:var(--mute)}
.wtags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:4px}
.badge{font-size:12px;font-weight:700;border:1px solid var(--acc);color:var(--acc2);border-radius:10px;padding:1px 8px}
.mini{display:inline-flex;gap:3px}.mini i{width:9px;height:9px;border-radius:50%;border:1.3px solid var(--line)}.mini i.on{background:var(--acc);border-color:var(--acc)}
.wl{font-size:14px;color:var(--ink);overflow-wrap:anywhere}.wl small{color:var(--mute)}
.wl .t{color:var(--acc2);font-variant-numeric:tabular-nums;margin-right:6px}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mgrid .h{text-align:center;font-size:12px;color:var(--mute);font-weight:600;padding:4px 0}
.mday{min-height:58px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:14px}
.mday.out{opacity:.38}.mday.now{border-color:var(--acc)}.mday.sel{background:var(--acc-soft);border-color:var(--acc)}
.mday{position:relative;overflow:hidden}.mday .dt{position:absolute;left:0;right:0;top:0;height:3px}
.persp{padding:16px 18px 12px;margin-top:6px}.persp .pk{font:600 11px Inter,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#d4af61}.persp .pk span{color:var(--mute);letter-spacing:.08em}
.pq{position:relative;margin:10px 0 12px;padding-left:30px;font:500 19px/1.45 Lora,Georgia,serif;color:#f5ecd8}.pq .pm{position:absolute;left:0;top:-6px;font:600 40px/1 Lora,Georgia,serif;color:rgba(212,175,97,.75)}
.pq.sm{font-size:17px;margin:4px 0 4px;padding-left:24px}.pq.sm .pm{font-size:32px;top:-4px}
.pa{display:flex;flex-wrap:wrap;gap:6px}.pab{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:14px;font-weight:600}.pab[aria-pressed=true]{color:#d4af61;border-color:rgba(212,175,97,.55)}.pab.gold{color:#d4af61;border-color:rgba(212,175,97,.45)}
.qrow2{border-top:1px solid var(--line);padding:12px 0}.qrow2:first-child{border-top:0;padding-top:0}
.dleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--mute)}.dleg span{display:inline-flex;align-items:center;gap:6px}.dleg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.wkrow{border-left:3px solid transparent;padding-left:10px}
.dcols{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:6px}.dcols label{display:flex;align-items:center;gap:10px;font-size:15px}.dcols input[type=color]{width:44px;height:36px;min-height:0;padding:2px;border-radius:8px;flex:none}
.mday .n{font-variant-numeric:tabular-nums}.mday.now .n{color:var(--acc2);font-weight:700}
.mdots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:11px;color:var(--acc2)}
.mdots i{width:6px;height:6px;border-radius:50%;background:var(--acc)}.mdots i.e{background:var(--ink)}.mdots i.k{background:none;border:1.3px solid var(--acc)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:12px}
.sheet .card{width:100%;max-width:560px;margin:0 0 calc(10px + env(safe-area-inset-bottom));border-color:var(--acc)}
.sheet .row{margin-top:10px}
.cal{margin-top:14px;padding:12px 16px}
.cal h3{margin:0 0 6px;font-family:Lora,serif;font-weight:600;font-size:17px;color:var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cal h3 small{font-family:Inter;font-weight:400;font-size:12px;color:var(--mute)}
.ev{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.ev:first-of-type{border-top:0}
.ev .tm{color:var(--acc2);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px;padding-top:1px}
.ev .nm{overflow-wrap:anywhere}.ev .cn{display:block;font-size:12px;color:var(--mute)}
.calnote{font-size:14px;color:var(--mute)}
.calnote button{margin-top:8px}
.sessev{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.sessev:first-of-type{border-top:0}
.sessev b{font-family:Lora,serif;font-size:16px;display:block}.sessev span{font-size:13px;color:var(--mute)}
.sessev.today b{color:var(--acc2)}
.appt{font-size:14px;color:var(--acc2);margin:4px 0 0}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}

const setP=(o,p,v)=>{const ks=p.split('.');let a=o;ks.slice(0,-1).forEach(k=>{if(a[k]==null||typeof a[k]!=='object')a[k]={};a=a[k]});a[ks.at(-1)]=v};

function toSec(t){if(!t)return 0;const p=String(t).split(':').map(Number);if(p.some(isNaN))return 0;return p.reduce((a,b)=>a*60+b,0)}
function pace(mi,t){const s=toSec(t),m=parseFloat(mi);if(!s||!m)return '';const p=Math.round(s/m);return Math.floor(p/60)+':'+pad(p%60)+' /mi'}

function chips(path,opts,val,cls=''){return `<div class="chips">${opts.map(([v,l])=>`<button class="chip ${cls}" data-set="${path}" data-v="${esc(v)}" aria-pressed="${String(val)===String(v)}" ${l&&l!==v?`title="${esc(l)}"`:''}>${esc(v)}</button>`).join('')}</div>`}

function ring(n,t){const r=26,c=2*Math.PI*r,p=t?n/t:0;return `<svg viewBox="0 0 64 64" class="ring" role="img" aria-label="${n} of ${t}"><circle cx="32" cy="32" r="${r}" fill="none" stroke="rgba(214,171,79,.15)" stroke-width="7"/>${p>0?`<circle cx="32" cy="32" r="${r}" fill="none" stroke="#d6ab4f" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 32 32)"/>`:''}<text x="32" y="37" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="15" font-weight="700" fill="currentColor">${t?Math.round(p*100)+'%':'–'}</text></svg>`}

function weekData(mon){
  const ds=[...Array(7)].map((_,i)=>addDays(mon,i)),rows=ds.map(d=>cache['day-'+d]);
  let hits=0,full=0;rows.forEach(r=>{let c=0;ANCH.forEach(([k])=>{if(lvl(r,k)>0){hits++;c++}});if(c===4)full++});
  const strength=rows.filter(r=>r?.ex?.some(e=>e.n)).length;
  const cardio=rows.filter(r=>r?.run?.k||parseFloat(r?.run?.mi)).length;
  const miles=rows.reduce((a,r)=>a+(parseFloat(r?.run?.mi)||0),0);
  const minD=rows.filter(r=>r?.min?.did).length;
  const sl=rows.map(r=>parseFloat(r?.sleep)).filter(n=>!isNaN(n));
  const avg=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):'–';
  return {ds,rows,pct:Math.round(hits/28*100),full,strength,cardio,miles,minD,sleep:avg(sl)};
}

function drawWeight(){

  const v=pts.map(p=>parseFloat(p.weight)),lo=Math.min(...v)-2,hi=Math.max(...v)+2,L=40,R=12,T=14,B=26;
  const x=i=>L+(W-L-R)*i/(pts.length-1),y=n=>T+(H-T-B)*(1-(n-lo)/(hi-lo));

  s.innerHTML=`<g font-size="12" fill="currentColor" opacity=".65"><text x="4" y="${y(hi-2)+4}">${(hi-2).toFixed(0)}</text><text x="4" y="${y(lo+2)+4}">${(lo+2).toFixed(0)}</text>

}

.claude?' Tap the <b>calendar button</b> on a block to add it to Google Calendar.':''}</li><li><b>Tasks</b> due that day. Unfinished tasks from earlier days show as <b>Carried over</b>, with <b>Move all to today</b>.</li></ul><p><b>Today tab views:</b></p><ul><li><b>Tasks:</b> add with or without a date. No date puts it in your Inbox. Change a task's date to reschedule it. <b>Import tasks</b> brings in a pasted list (one per line, dates picked up) or a Google Tasks export from takeout.google.com.</li><li><b>Week:</b> each day's type, anchor ticks, Top 3, tasks${window.claude?' and calendar events':''}. With the shift cycle on, switch to the 15-day cycle view. Your weekly check-in is below.</li><li><b>Month:</b> a calendar grid. Tap a day to see its events, tasks and journal entry${window.claude?', or <b>+ Add event</b>':''}.</li></ul><p>Use <b>‹ ›</b> at the top to move between weeks, cycles, or months.</p>`)}
  ${sec('Spiritual',`<p>The <b>Spiritual</b> tab gathers everything spiritual for a day (use ‹ › to change days):</p><ul><li><b>Activities:</b> daily text, Bible reading, meditation, meeting prep, meetings and field service from your routine${window.claude?' and calendar':''}. Check them off here or on Today; they stay in sync. Add extra activities like family worship or research.</li><li><b>Bible reading:</b> your next reading from the schedule, <b>Mark as read</b>, progress, and under <b>Track, place and history</b> the red-diamond and blue-dot tracks, Set my place, and recent readings.</li><li><b>Study notes:</b> tap <b>+ New note</b>, choose Bible reading, Personal study, Meeting prep, Research or Other, add the scripture or topic, and write. Filter by type or search. Tap a note to edit it.</li></ul>`)}

// ---------- backup ----------
function backupJSON(){const o={};Object.keys(cache).forEach(k=>{o[k]=cache[k]});return JSON.stringify({app:'anchors-journal',v:1,exported:new Date().toISOString(),data:o},null,1)}
async function exportData(){
  const name='kl-journal-backup-'+today()+'.json',data=backupJSON();
  try{const dl=window.claude?await claude.use('downloads'):null;if(dl){await dl.save({filename:name,data});return}}catch(e){if(e&&e.code)return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
}
let pendingImp=null;
function readImport(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);const d=j.data||j;const keys=Object.keys(d).filter(k=>/^(day|week|progress|session)-\d{4}-\d{2}-\d{2}$|^(settings|sessq|tasks)$|^note-[a-z0-9]+$/.test(k)&&d[k]&&typeof d[k]==='object');
  if(!keys.length)throw 0;pendingImp={d,keys};$('#impMsg').innerHTML=`<div class="note">Import ${keys.length} entries? Entries with the same date are replaced. <div class="chips" style="margin-top:8px"><button class="btn sm pri" data-act="doimp">Import</button><button class="btn sm" data-act="noimp">Cancel</button></div></div>`}
  catch(e){$('#impMsg').innerHTML='<div class="note">That file isn’t an Anchors backup.</div>'}};r.readAsText(file)}
async function doImport(){if(!pendingImp)return;const {d,keys}=pendingImp;pendingImp=null;$('#impMsg').innerHTML='<div class="note">Importing…</div>';
  for(const k of keys){cache[k]=d[k];if(mode==='remote'){try{await remote.doc(k).set(d[k])}catch(e){$('#impMsg').innerHTML='<div class="note">Import stopped part-way — try again.</div>';return}}}
  if(mode!=='remote'){const t=Date.now();keys.forEach(k=>{if(cache[k]&&typeof cache[k]==='object')cache[k]._u=t;driveQueue(k)});lsSave()}$('#impMsg').innerHTML=`<div class="note">Imported ${keys.length} entries.</div>`}

// ---------- startup ----------
function useLocal(msg){mode='local';Object.assign(cache,lsLoad());READY=true;setStatus(msg||(driveOn()?'Checking Google Drive…':'Saved on this device'));render();if(driveOn()){drivePull();setInterval(drivePull,300000)}}
async function start(){
  render();
  if(!window.claude||typeof claude.use!=='function'){useLocal();return}
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    const uid=user?await user.id():null;
    if(!db||!uid){useLocal('Saving on this device only');return}
    remote=db.collection('data/users/'+uid);mode='remote';
    let timer=setTimeout(()=>setStatus('Can’t reach your journal yet — changes will save when it connects',true),10000);
    remote.onSnapshot(snap=>{
      if(!snap.metadata.fromCache){clearTimeout(timer);if(!dirty.size)setStatus('Saved');if(!READY){READY=true;touchedReady=true}}
      let touchedCurrent=false;var touchedReady=touchedReady||false;
      snap.docChanges().forEach(ch=>{const k=ch.doc.id;if(dirty.has(k))return;
        if(ch.type==='removed')delete cache[k];else cache[k]=JSON.parse(JSON.stringify(ch.doc.data()));
        if(k==='day-'+S.date||k==='week-'+S.week||S.tab!=='today')touchedCurrent=true});
      const busy=document.activeElement&&main.contains(document.activeElement)&&/INPUT|TEXTAREA/.test(document.activeElement.tagName);
      if((touchedCurrent||touchedReady)&&!busy){const y=scrollY;render();scrollTo(0,y)}
    },err=>{clearTimeout(timer);setStatus('Lost connection — reload the page to keep saving',true)});
  }catch(e){useLocal('Saving on this device only')}
}
start();
