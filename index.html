<style>
/* VOICE: quiet and personal, like a leather-bound journal.
   IDEA: the KL cover: black grain leather, gold foil monogram, gold stitching.
   PICTURE: the writing page itself, gold-ruled on black, with the KL monogram in the header.
   COLOUR and TYPE: near-black leather, warm ivory ink, one gold accent; Cinzel for titles, Lora for writing, Inter for controls.
   LAYOUT: one column up to 760px, sticky header with a stitched gold edge, bottom tab bar. */
:root{color-scheme:dark;
 --bg:#0d0c0b;--card:#171513;--ink:#efe7d6;--mute:#a69d8b;--line:#2e2a25;--soft:#1f1c18;
 --acc:#d6ab4f;--acc2:#f0cf7a;--acc-ink:#191206;--acc-soft:rgba(214,171,79,.13);--ok:#9fcf8f}
*{box-sizing:border-box;min-width:0}
html{background:#0d0c0b}body{margin:0;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;padding-bottom:150px}
h1,h2{font-family:Lora,Georgia,serif;font-weight:600;line-height:1.1;margin:0}
h1{font-family:Cinzel,Lora,serif;font-weight:600;letter-spacing:.06em;font-size:clamp(24px,5.5vw,30px);color:var(--acc2)}h2{font-size:21px;margin:0 0 10px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top);border-bottom:0}
body.has-hero header{background:transparent}body.has-hero header.solid{background:var(--bg)}
body.has-hero header .ib{background:rgba(13,12,11,.42);border-color:rgba(212,175,97,.22);color:#f5ecd8}
body.has-hero header .bar small{color:#cfc4ae}header .bar .mono{order:0}header .bar .t{order:1}header #prev{order:2}header #next{order:3}header .ib{width:38px;height:38px;border-radius:11px;font-size:18px}
.mono{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--acc);display:grid;place-items:center;font-family:Cinzel,serif;font-weight:600;font-size:16px;color:var(--acc2);flex:none}
.bar{display:flex;align-items:center;gap:8px;padding:10px 0}.wrap.bar{padding:10px 16px}
.bar .t{flex:1}.bar small{display:block;color:var(--mute);font-size:13px}
.status{font-size:11px;line-height:1.4;color:var(--mute);opacity:.55;text-align:center;white-space:nowrap;padding:18px 0 4px}.status.warn{opacity:1;color:#e0574b}
.status.warn{color:var(--acc)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;line-height:1}
:root{--gline:rgba(212,175,97,.22);--gline2:rgba(212,175,97,.4);--gold:#d4af61;--cream:#f5ecd8;--r:16px}
.card{background:var(--card);border:1px solid var(--gline);border-radius:var(--r);padding:16px;margin:12px 0}
.card h2{font-size:20px}
/* collapsible row card (Spiritual, Sessions, More, Home) */
details.rcard{background:var(--card);border:1px solid var(--gline);border-radius:var(--r);margin:12px 0;overflow:hidden}
details.rcard>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:64px}

.ri{width:40px;height:40px;flex:none;display:grid;place-items:center;color:var(--gold)}.ri svg{width:26px;height:26px}
.rtx{flex:1;min-width:0}.rtx b{display:block;font:600 18px/1.25 Lora,Georgia,serif;color:var(--cream)}.rtx small{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.rn{color:var(--mute);font-size:14px;white-space:nowrap}
.chev{width:22px;height:22px;flex:none;color:var(--cream);opacity:.75;transition:transform .15s}.chev svg{width:22px;height:22px}
details[open]>summary .chev{transform:rotate(90deg)}
.rbody{padding:0 16px 16px;border-top:1px solid var(--line)}.rbody>*:first-child{margin-top:14px}
.rbody .card{background:none;border:0;padding:0;margin:16px 0 0;border-radius:0}.rbody .card h2{font-size:17px;color:var(--gold);margin-bottom:8px}

.rsum-act{flex:none}
/* routine groups on Today */

/* gold primary action */

function vcMsg(t){const m=$('#cap-m')||$('#vc-jmsg');if(m)m.textContent=t}
async function vcAddFiles(files,how,target){files=[...(files||[])].filter(f=>/^image\//.test(f.type||''));if(!files.length){vcMsg('That isn’t a photo or screenshot.');return}
  vcMsg('Saving '+files.length+' photo'+(files.length>1?'s':'')+'…');let ok=0;
  for(const f of files){try{const m=await vcIngest(f,how);ok++;if(target==='journal'){const d=get('day-'+S.date,dayDef(S.date));d.dimg=(d.dimg||[]).concat(m.id);save('day-'+S.date)}else VCQ.push(m.id)}
    catch(e){vcMsg(e.message==='quota'?'This device is out of storage for photos. Delete some photos in More › Photos, or download a backup.':'Couldn’t open that image.');return}}
  vcMsg(ok?`${ok} photo${ok>1?'s':''} attached. Tap ✦ Organize to read ${ok>1?'them':'it'}, or Add to keep ${ok>1?'them':'it'} as is.`:'');
  if(target==='journal'){const y=scrollY;render();scrollTo(0,y)}else vcPaintQ()}

async function vcPaste(target){try{const its=await navigator.clipboard.read(),files=[];for(const it of its){const t=it.types.find(x=>/^image\//.test(x));if(t){const b=await it.getType(t);files.push(new File([b],'pasted.'+(t.split('/')[1]||'png'),{type:t}))}}
  if(files.length)vcAddFiles(files,'paste',target);else vcMsg('No image on the clipboard. Copy a photo or screenshot first.')}catch(e){vcMsg('Paste was blocked. Press and hold in the box and choose Paste, or use Photos.')}}
let VCREC=null;
function vcDictate(btn){const SR=vcSR();if(!SR)return;if(VCREC){VCREC.stop();return}const t=$('#cap-t')||main.querySelector('[data-jd=draft]');if(!t)return;
  const r=new SR();r.lang=navigator.language||'en-US';r.interimResults=false;r.continuous=true;VCREC=r;btn.setAttribute('aria-pressed','true');vcMsg('Listening… tap Dictate again to stop.');
  r.onresult=e=>{let s='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)s+=e.results[i][0].transcript;if(s){t.value=(t.value?t.value.replace(/\s*$/,' '):'')+s.trim();t.dispatchEvent(new Event('input',{bubbles:true}))}};
  r.onend=()=>{VCREC=null;btn.setAttribute('aria-pressed','false');vcMsg('')};r.onerror=()=>{vcMsg('Dictation isn’t available right now. Your keyboard’s microphone works too.')};try{r.start()}catch(e){VCREC=null}}
function vcProgress(html){const sh=$('#capsheet');sh.innerHTML=`<div class="card capcard" role="dialog" aria-modal="true" aria-label="Reading photos"><div class="caphd"><span class="spk">${SPARK}</span><div><h2>Smart Capture</h2><small>Capture anything. Give everything a place.</small></div></div><div class="vprog">${html}</div></div>`;sh.classList.remove('hide')}

async function vcOrganize(note,ids,ctx){ids=(ids||[]).filter(Boolean);let items=[],kept=[];const imgs=[];
  if(note&&note.trim()){const r=capAnalyze(note,ctx);r.items.forEach(it=>{const real=it.title.trim().split(/\s+/).length>=2&&(startsWithVerb(it.src)||ACT_RE.test(it.src)||['appt','question','research','move','goal','objective','routine'].includes(it.kind));if(!ids.length||real)items.push(it);else kept.push({s:it.src,why:'caption for the photo'})});kept=kept.concat(r.kept)}
  for(let i=0;i<ids.length;i++){const id=ids[i],m=imgMeta(id);if(!m)continue;const lab=`Reading photo ${i+1} of ${ids.length} on this device…`;vcProgress(`<p>${lab}</p><div class="hbar"><i id="vcpb" style="width:3%"></i></div><p class="calnote" id="vcpn">The first time, this downloads the text reader (about 7 MB). After that it works offline.</p>`);
    let ocr=m.ocr;
    if(!ocr||ocr.err){try{ocr=await vcOcr(id,p=>{const bar=$('#vcpb');if(bar&&p.status==='recognizing text')bar.style.width=Math.round(10+p.progress*90)+'%';else if(bar&&/load/.test(p.status||''))bar.style.width=Math.round(3+p.progress*7)+'%'});ocr.text=vcRedact(ocr.text).slice(0,12000);ocr.lines=ocr.lines.slice(0,400).map(l=>({t:vcRedact(l.t),c:l.c}));m.ocr={text:ocr.text,conf:ocr.conf,lines:ocr.lines,at:Date.now(),by:'device'};save('images')}
      catch(e){ocr={text:'',conf:0,lines:[],err:e&&e.message||'ocr'}}}
    const dup=vcFindDup(m.ph,id),ictx={kind:'image',key:'img',id:m.ph,img:id,date:ctx.date||today()};
    const u=ocr.err?{type:'photo',label:'Photo',items:[],uncertain:[],text:''}:vcUnderstand(ocr,ictx,note);
    if(ocr.err)u.items.push({id:uid(),src:'(photo)',kind:'photo',dest:'journal',cat:'journal',group:'Journal',title:(note||'').trim()||'Photo',date:'',time:'',win:'',imp:false,conf:'low',notes:[window.claude?'Photo reading works in the home-screen app (kd2littlejohn.github.io/kl-journal). Here you can keep it as a photo':'Couldn’t read text '+(navigator.onLine?'here':'offline yet — the text reader downloads once when you’re online')+'. You can keep it as a photo'],sel:false,img:id});
    m.type=u.type;save('images');
    if(dup){u.items.forEach(it=>{it.prev=true;it.sel=false;it.notes.unshift('Already processed from this photo on '+fmtDate(ymd(new Date(dup.proc.at)),{month:'short',day:'numeric'}))})}
    imgs.push({id,type:u.type,label:u.label,conf:ocr.conf||0,text:u.text,unc:u.uncertain,dup:dup?dup.id:'',err:ocr.err||'',by:'device'});items=items.concat(u.items)}
  // keep the reviewed items ordered: note first, then each photo
  CAPS={items,kept,ctx,imgs,note:note||'',keep:true};capSheet()}
function vcSheetImgs(C){return `<div class="vimgs">${C.imgs.map((im,k)=>`<div class="vimg"><button class="vtb big" data-vview="${esc(im.id)}" aria-label="View photo">${vcThumb(im.id)}</button><div class="vimeta">

function vcReread(k,text){const C=CAPS;if(!C||!C.imgs[k])return;const im=C.imgs[k],m=imgMeta(im.id)||{};const ictx={kind:'image',key:'img',id:m.ph||im.id,img:im.id,date:C.ctx.date||today()};

    ${url?`<img class="vfull" src="${url}" alt="Photo">`:`<p class="calnote">${m?'This photo isn’t stored on this device. It may be on your other device.':'This photo was deleted. What was made from it is still here.'}</p>`}
    ${m&&m.ocr&&m.ocr.text?`<details class="vtext"><summary>Text read from this photo ${m.ocr.by==='ai'?'· ☁ AI':'· on this device'}</summary><pre>${esc(m.ocr.text)}</pre></details>`:''}
    ${recs.length?`<p class="lbl" style="margin:10px 0 4px">Made from this photo</p><ul class="vrecs">${recs.map(r=>`<li>${esc(r.title)} <small class="muted">· ${esc(CAPDEST[r.dest]||r.dest)}</small></li>`).join('')}</ul>`:''}
    <div class="chips" style="margin-top:12px">${m&&url?`<button class="btn pri" data-vv="org" data-id="${esc(id)}"><span class="orgbtn">${SPARK}Organize${m.proc?' again':''}</span></button>`:''}${m?`<button class="btn" data-vv="del" data-id="${esc(id)}">Delete photo</button>`:''}<button class="btn" data-vv="close">Close</button></div>

function vcViewClose(){const sh=$('#vcview');if(!sh)return;sh.classList.add('hide');if(sh._url){URL.revokeObjectURL(sh._url);sh._url=''}}
function vcViewClick(e){if(e.target.id==='vcview'){vcViewClose();return}const b=e.target.closest('[data-vv]');if(!b)return;const a=b.dataset.vv;
  if(a==='close'){vcViewClose();return}
  if(a==='org'){vcViewClose();vcOrganize('',[b.dataset.id],{kind:'inbox',key:'img',id:b.dataset.id,date:today()});return}
  if(a==='del'){if(!b.dataset.armed){b.dataset.armed=1;b.textContent='Tap again to delete';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Delete photo'}},3000);return}

function vcApplyBody(it,src,created){const r=it.rec||{},dd=it.date||today(),k='progress-'+dd,prev=cache[k]?JSON.parse(JSON.stringify(cache[k])):null;const p=cache[k]||(cache[k]={date:dd});
  if(r.weight!=null)p.weight=String(r.weight);p.comp=Object.assign({},p.comp||{},r.comp||{});p.src=src;save(k);created.push({type:'body',key:k,prev})}

const vcAIOn=()=>{try{return !!(get('settings',setDef).ai||{}).vision&&bridgeOn()}catch(e){return false}};
const VC_KINDS=['task','appt','move','body','snote','quote','question','journal','idea'];
function vcAIValidate(r){if(!r||typeof r!=='object')throw new Error('bad_ai');const S1=(v,n)=>typeof v==='string'?v.replace(/[\u0000-\u001f]/g,' ').trim().slice(0,n):'';const N=(v,lo,hi)=>{const x=Number(v);return isFinite(x)&&x>=lo&&x<=hi?Math.round(x*100)/100:undefined};
  const D=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&!isNaN(parse(v))&&ymd(parse(v))===v?v:'',T=v=>typeof v==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(v)?v:'';
  const out={type:VC_TYPES[r.type]?r.type:'note',summary:S1(r.summary,300),text:vcRedact(S1(r.text,12000)),unreadable:Array.isArray(r.unreadable)?r.unreadable.slice(0,20).map(x=>S1(x,200)).filter(Boolean):[],items:[]};
  (Array.isArray(r.items)?r.items:[]).slice(0,40).forEach(x=>{if(!x||!VC_KINDS.includes(x.kind))return;const it={kind:x.kind,title:vcRedact(S1(x.title,200)),date:D(x.date),time:T(x.time),group:S1(x.group,40),notes:(Array.isArray(x.notes)?x.notes:[]).slice(0,4).map(n=>S1(n,120)).filter(Boolean),conf:['high','medium','low'].includes(x.confidence)?x.confidence:'medium'};
    if(!it.title)return;
    if(x.kind==='move'&&x.move){const m=x.move,a=['run','walk','cycle','workout','pushups','pullups','squats','plank','strength'].includes(m.activity)?m.activity:null;if(!a)return;
      it.move={a,mi:N(m.distance_mi,0,300),dur:N(m.duration_sec,1,86400),sets:Array.isArray(m.sets)?m.sets.map(s=>N(s,1,2000)).filter(Boolean).slice(0,30):undefined,reps:N(m.reps,1,500),w:N(m.weight_lb,0,2000),name:S1(m.exercise,60),kcal:N(m.kcal,1,10000),hr:N(m.avg_hr,30,240)}}
    if(x.kind==='body'&&x.body){const b=x.body;it.body={weight:N(b.weight_lb,40,800),comp:{bodyFat:N(b.body_fat_pct,1,80),bmi:N(b.bmi,8,80),muscle:N(b.muscle_lb,10,400),skeletal:N(b.skeletal_pct,5,80),water:N(b.water_pct,10,90),visceral:N(b.visceral,1,60),bone:N(b.bone_lb,1,40),bmr:N(b.bmr,500,5000),metAge:N(b.metabolic_age,10,110),protein:N(b.protein_pct,1,60)}};Object.keys(it.body.comp).forEach(k=>{if(it.body.comp[k]==null)delete it.body.comp[k]})}
    if(x.kind==='snote')it.study={ref:S1(x.study&&x.study.ref,40),type:NTYPES.includes(x.study&&x.study.type)?x.study.type:'Personal study'};
    if(x.kind==='quote')it.quote={q:S1(x.quote&&x.quote.text||x.title,300),by:S1(x.quote&&x.quote.by,60)};
    out.items.push(it)});return out}
function vcAIItems(v,img,base){const out=[];v.items.forEach(x=>{const it={id:uid(),src:'(read by AI)',kind:x.kind,title:x.title,date:x.date,time:x.time,win:'',dest:'task',cat:'other',group:x.group||'General',imp:false,conf:x.conf,notes:x.notes.concat(['Read by AI']),sel:x.conf!=='low',img};
    if(x.kind==='appt'){it.dest=MCP&&it.time?'cal':'plan';if(!it.date){it.sel=false;it.notes.push('Date not found')}}
    else if(x.kind==='question')it.dest='question';
    else if(x.kind==='journal'){it.dest='journal';it.kind='photo'}
    else if(x.kind==='idea'){it.dest='idea';it.sel=false}
    else if(x.kind==='snote'){it.dest='snote';it.cat='spiritual';it.rec={type:x.study.type,ref:x.study.ref,text:v.text}}
    else if(x.kind==='quote'){it.dest='quote';it.rec=x.quote}
    else if(x.kind==='body'){if(!x.body)return;it.dest='body';it.cat='movement';it.rec=x.body;it.date=it.date||base;it.notes.push('Health info — saved only on your devices')}
    else if(x.kind==='move'){const m=x.move;if(!m)return;let rec={a:m.a,kcal:m.kcal,hr:m.hr};if(['pushups','pullups','squats'].includes(m.a)){if(!m.sets||!m.sets.length)return;rec.sets=m.sets}else if(m.a==='plank'||m.a==='workout'){if(!m.dur)return;rec.secs=[m.dur]}else if(m.a==='strength'){if(!m.reps)return;Object.assign(rec,{name:m.name||'Lift',sets:m.sets&&m.sets.length?m.sets.length:1,reps:m.reps,w:m.w||0})}else{if(!m.mi&&!m.dur)return;rec.mi=m.mi||0;rec.dur=m.dur||0}
      it.dest='move';it.cat='movement';it.group='Fitness';it.rec=rec;it.sets=rec.sets;it.date=it.date||base;it.title=mvCapTitle(rec)+(m.kcal?' · '+m.kcal+' kcal':'')}
    else{it.cat=capCat(it.title);if(!x.group)it.group=capGroup(it.title,'task')}
    out.push(it)});return out}
async function vcAI(k,btn){const C=CAPS;if(!C||!C.imgs[k])return;if(!btn.dataset.armed){btn.dataset.armed=1;btn.textContent='Tap again to send this photo'+(C.note?' and your note':'')+' to Anthropic';setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent='☁ Read with AI'}},5000);return}
  const im=C.imgs[k];btn.disabled=true;btn.textContent='☁ Reading in the cloud…';
  try{const full=await IMGDB.get('full',im.id);const {im:el,u}=await vcLoadImg(full);let data;try{const c=await vcCanvas(el,1568,'image/jpeg',.82);data=(await vcBlobToData(c.b)).split(',')[1]}finally{URL.revokeObjectURL(u)}
    const res=await bcall('vision',{images:[{mime:'image/jpeg',data}],note:C.note||'',today:today(),tz:Intl.DateTimeFormat().resolvedOptions().timeZone||''});
    if(res&&res.error)throw new Error(res.error);const v=vcAIValidate(res.result);const items=vcAIItems(v,im.id,C.ctx.date||today());
    const m=imgMeta(im.id),reg=capReg();items.forEach(it=>{it.h=capHash('img|'+((m&&m.ph)||im.id)+'|'+capNorm(it.title));if(reg.some(r=>r.h===it.h)){it.prev=true;it.sel=false;it.notes.unshift('Already organized from this photo')}});
    C.items=C.items.filter(it=>it.img!==im.id).concat(items);Object.assign(im,{type:v.type,label:VC_TYPES[v.type]||'Note',text:v.text,unc:v.unreadable,by:'ai',conf:0});if(m){m.ocr={text:v.text,conf:0,lines:v.text.split('\n').map(t=>({t,c:90})),at:Date.now(),by:'ai'};m.type=v.type;save('images')}capSheet()}
  catch(e){btn.disabled=false;delete btn.dataset.armed;const c=e&&(e.message||e.code);btn.textContent=c==='no_ai_key'?'Add your AI key to the Apps Script first':c==='unknown_op'?'Update your Apps Script first (see More)':'Couldn’t reach AI — try again';}}

function mrSet(){const st=get('settings',setDef);if(!st.mr)st.mr={on:true,ambient:false,days:{S:{on:true,int:60},O:{on:true,int:60},L:{on:true,int:60},R:{on:true,int:60},X:{on:true,int:60}},active:['07:00','21:00'],quiet:['',''],cats:MRCAT.map(c=>c.id),sound:'chime',anchor:true};
  const m=st.mr;m.days=m.days||{};MRKINDS.forEach(([k])=>{m.days[k]=Object.assign({on:true,int:60},m.days[k]||{})});m.cats=m.cats||MRCAT.map(c=>c.id);m.active=m.active||['07:00','21:00'];m.quiet=m.quiet||['',''];return m}

const mrNow=()=>Date.now();

function mrDurTxt(ms){const m=Math.max(0,Math.round(ms/60000));return m<60?m+' min':Math.floor(m/60)+' hr'+(m%60?' '+m%60+' min':'')}
const mrClock=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+pad(s%60)};
function mrInWin(a,b,now){if(!a||!b)return false;const n=new Date(now),m=n.getHours()*60+n.getMinutes(),x=+a.slice(0,2)*60+ +a.slice(3),y=+b.slice(0,2)*60+ +b.slice(3);return x<=y?(m>=x&&m<y):(m>=x||m<y)}

function mrInterval(){const m=mrSet();return (m.days[mrKind()]||{}).int||60}
// why reminders are quiet right now ('' = they can run)
function mrQuietWhy(now){const m=mrSet(),s=mrState();now=now||mrNow();if(!m.on)return 'off';if(s.pauseUntil&&now<s.pauseUntil)return 'paused';if(!(m.days[mrKind()]||{}).on)return 'day';
  if(!mrInWin(m.active[0],m.active[1],now))return 'hours';if(m.quiet[0]&&m.quiet[1]&&mrInWin(m.quiet[0],m.quiet[1],now))return 'quiet';return ''}

  const iv=mrInterval()*60000,why=mrQuietWhy(now),focus=!!s.focus;
  if(why){if(s.nextDue&&now>s.nextDue)s.nextDue=0;s.amb=0;mrSave();mrPaintClock();return}

    if(now>=s.nextDue){if(now-s.nextDue>180000){s.nextDue=now+iv;mrSave()}            // came back late: no pile-up, no catch-up pop-up

function vStLibrary(){const d=stDoc(),act=d.topics.filter(t=>!t.done).sort((a,b)=>(b.at||0)-(a.at||0)),done=d.topics.filter(t=>t.done),openQ=d.questions.filter(q=>!q.done);

function vStJournal(){const d=stDoc(),ss=d.sessions.filter(s=>((s.steps||{}).conclude||'').trim()||((s.steps||{}).meditate||'').trim()).sort((a,b)=>(b.at||0)-(a.at||0)),cs=d.items.filter(i=>i.kind==='concl').sort((a,b)=>b.at-a.at);

    ${cs.length?`<p class="lbl" style="margin:12px 0 4px">Saved conclusions</p>${cs.map(i=>stItemRow(i)).join('')}`:''}</div>`}
function vStTopic(t){const d=stDoc(),items=d.items.filter(i=>i.topic===t.id),refs=stTopicRefs(t.id),sess=d.sessions.filter(s=>s.topic===t.id).sort((a,b)=>(b.at||0)-(a.at||0)),qs=d.questions.filter(q=>q.topic===t.id),rel=(t.related||[]).map(stTopic).filter(Boolean);

    ${rc('stt-refs',IC.book,'Scriptures',refs.length+' reference'+(refs.length===1?'':'s'),refs.length?`<div class="strefs">${refs.map(stLink).join('')}</div><p class="calnote">Each opens in JW Library or on jw.org (New World Translation).</p>`:'<p class="empty">Scriptures you mention in sessions or add below appear here.</p>',true)}
    ${rc('stt-items',IC.list,'Discoveries',items.length+' saved',`${['scripture','fact','pub','concl','note'].map(k=>by(k).length?`<p class="lbl" style="margin:8px 0 4px">${STKINDS[k][0]}</p>${by(k).map(i=>stItemRow(i,true)).join('')}`:'').join('')||'<p class="empty">Nothing saved yet.</p>'}
      <div class="mvform" style="margin-top:10px"><label><span class="lbl">Add</span><select data-stf="ikind">${['scripture','fact','pub','concl','note'].map(k=>`<option value="${k}">${STKINDS[k][0]}</option>`).join('')}</select></label><label style="grid-column:span 2"><span class="lbl">Text or reference</span><input data-stf="itext" maxlength="600" placeholder="e.g. Galatians 3:17 or a discovery"></label><label><span class="lbl">Source (publications)</span><input data-stf="isrc" maxlength="120" placeholder="e.g. it-1 p. 1234"></label><button class="btn" data-st="iadd" data-id="${esc(t.id)}">Add</button></div><p class="calnote" id="st-imsg"></p>`,items.length>0)}
    ${rc('stt-qs',IC.glance,'Questions',qs.filter(q=>!q.done).length+' open',`${qs.map(stQRow).join('')||'<p class="empty">No questions yet.</p>'}<div class="mvform" style="margin-top:8px"><label style="grid-column:1/-2"><span class="lbl">New question</span><input data-stf="qtext" maxlength="300" placeholder="What do I still want to find out?"></label><button class="btn" data-st="qadd" data-id="${esc(t.id)}">Add</button></div>`,qs.some(q=>!q.done))}
    ${rc('stt-sess',IC.pen,'Study sessions',sess.length+'',sess.map(stSessRow).join('')||'<p class="empty">Start your first session above.</p>',sess.length>0)}
    ${rc('stt-rel',IC.layers,'Related topics',rel.length+' linked',`${rel.map(o=>`<span class="chip">${esc(o.title)} <button class="x sm" data-st="unrel" data-id="${esc(t.id)}" data-o="${esc(o.id)}" aria-label="Unlink">×</button></span>`).join('')}
      ${auto.length?`<p class="calnote">Share scriptures with this topic: ${auto.map(o=>`<button class="chip" data-st="rel" data-id="${esc(t.id)}" data-o="${esc(o.id)}">+ ${esc(o.title)}</button>`).join(' ')}</p>`:''}
      ${d.topics.filter(o=>o.id!==t.id&&!(t.related||[]).includes(o.id)).length?`<select data-stf="relpick" data-id="${esc(t.id)}"><option value="">Link a topic…</option>${d.topics.filter(o=>o.id!==t.id&&!(t.related||[]).includes(o.id)).map(o=>`<option value="${esc(o.id)}">${esc(o.title)}</option>`).join('')}</select>`:''}`,rel.length>0)}
    ${rc('stt-notes',IC.pen,'Study notes',linked.length+' linked',`${linked.map(n=>`<div class="sthist"><b>${n.ref?stLinkify(n.ref)+' · ':''}${esc(n.type||'Note')}</b><small>${esc(fmtDate(n.date||today(),{month:'short',day:'numeric'}))}</small><span>${stLinkify((n.text||'').slice(0,240))}</span><button class="lnkg" data-st="nunlink" data-k="note-${esc(n.id)}">Unlink</button></div>`).join('')||'<p class="empty">None linked.</p>'}
      ${free.length?`<select data-stf="nlink" data-id="${esc(t.id)}"><option value="">Link a study note from Spiritual…</option>${free.map(n=>`<option value="note-${esc(n.id)}">${esc((n.ref?n.ref+' · ':'')+(n.type||'Note')+' · '+fmtDate(n.date||today(),{month:'short',day:'numeric'}))}</option>`).join('')}</select>`:''}`,linked.length>0)}`}
function vStSess(s){const t=stTopic(s.topic),done=STSTEPS.filter(([k])=>((s.steps||{})[k]||'').trim()).length,A=ST.ana&&ST.anaSess===s.id?ST.ana:null;
  return `${stBack(t?'topic':'dash',t?t.title:'Personal Study')}<div class="card stcur"><div class="chd"><h2>${esc(t?t.title:'Study session')}</h2><small>${esc(fmtDate(s.date,{weekday:'short',month:'short',day:'numeric'}))}</small></div>
      <div class="stdots" aria-label="${done} of 7 steps written">${STSTEPS.map(([k])=>`<i class="${((s.steps||{})[k]||'').trim()?'on':''}"></i>`).join('')}</div>
      <p class="calnote" style="margin:4px 0 0">No step is required. Write what helps; skip the rest.</p></div>
    ${STSTEPS.map(([k,l,q],i)=>{const v=(s.steps||{})[k]||'',isOpen=ST.open[s.id+k]!=null?ST.open[s.id+k]:(i===0||!!v.trim());
      return `<details class="card ststep" data-k="${k}" ${isOpen?'open':''}><summary><span class="stn">${i+1}</span><span><b>${l}</b><small>${q}</small></span>${v.trim()?'<span class="stok">✓</span>':''}</summary>
        <textarea class="write wsm" data-stw="${k}" data-id="${esc(s.id)}" placeholder="${esc(q)}" aria-label="${esc(l)}">${esc(v)}</textarea>
        ${k==='research'||k==='read'?`<div class="chips"><button class="btn sm" data-st="paste" data-id="${esc(s.id)}" data-k="${k}">Paste material</button><label class="btn sm vcb2"><input type="file" accept="image/*" data-stimg="${k}" data-id="${esc(s.id)}" hidden>Photo or screenshot</label></div>`:''}
        ${v.trim()?`<div class="chips" style="margin-top:6px"><button class="btn sm" data-st="analyze" data-id="${esc(s.id)}" data-k="${k}"><span class="orgbtn">${SPARK}Organize this step</span></button>${k==='meditate'||k==='read'||k==='research'?`<button class="btn sm" data-st="medsess" data-id="${esc(s.id)}" data-k="${k}">Meditate on this</button>`:''}</div>`:''}
        ${A&&ST.anaStep===k?stAnaHTML(A,s):''}</details>`}).join('')}
    <div class="card"><div class="chips"><button class="btn pri" data-st="finish" data-id="${esc(s.id)}">${s.done?'Finished ✓':'Finish session'}</button><button class="btn" data-st="copy" data-id="${esc(s.id)}">Copy study entry</button><button class="btn" data-st="delsess" data-id="${esc(s.id)}">Delete</button></div><p class="calnote" id="st-smsg"></p></div>`}
function stAnaHTML(A,s){const rows=[];let n=0;const add=(kind,text,extra)=>{rows.push({i:n++,kind,text,extra})};
  A.refs.forEach(r=>add('scripture',r.label));A.pubs.forEach(p=>add('pub',p,{src:p}));A.dates.forEach(x=>add('fact',x));A.facts.slice(0,4).forEach(x=>add('fact',x));A.concl.slice(0,4).forEach(x=>add('concl',x));
  A.qs.forEach(x=>add('q',x));A.sugg.forEach(x=>add('sugg',x));ST.anaRows=rows;
  if(!rows.length&&!A.quals.length&&!A.others.length)return '<div class="stana"><p class="calnote">Nothing to organize in this step yet.</p></div>';
  const lab={scripture:'Scripture',pub:'Publication',fact:'Fact & date',concl:'My conclusion',q:'My question',sugg:'Suggested'};
  return `<div class="stana"><p class="lbl" style="margin:0 0 6px">Found in what you wrote</p>${rows.map(r=>`<label class="stpick"><input type="checkbox" data-stpick="${r.i}" ${r.kind==='sugg'?'':'checked'}><em class="stbadge ${r.kind==='q'?'note':r.kind}">${lab[r.kind]}</em><span>${r.kind==='scripture'?stLinkify(r.text):esc(r.text)}</span></label>`).join('')}
    ${A.quals.length?`<p class="calnote">Qualities of Jehovah you mentioned: ${A.quals.map(esc).join(', ')}</p>`:''}${A.others.length?`<p class="calnote">Connects with: ${A.others.map(o=>`<button class="chip" data-st="rel" data-id="${esc(s.topic)}" data-o="${esc(o.id)}">+ ${esc(o.title)}</button>`).join(' ')}</p>`:''}
    <p class="calnote">“My question” goes to your open questions. “Suggested” is a question from KL Journal for you to think through. KL Journal only sorts what you wrote; it never adds scripture text or conclusions.</p><div class="chips"><button class="btn sm pri" data-st="anasave" data-id="${esc(s.id)}">Save checked</button><button class="btn sm" data-st="anaclose">Close</button></div></div>`}
function stSearch(q){const w=q.toLowerCase().trim(),d=stDoc(),hits=[];const has=t=>String(t||'').toLowerCase().includes(w);
  d.topics.forEach(t=>{if(has(t.title)||has(t.desc))hits.push(['Topic',t.title,'topic',t.id])});
  d.sessions.forEach(s=>{const k=STSTEPS.find(([k])=>has((s.steps||{})[k]));if(k){const t=stTopic(s.topic),txt=s.steps[k[0]],i=txt.toLowerCase().indexOf(w);hits.push(['Session · '+k[1],(t?t.title+' — ':'')+'…'+txt.slice(Math.max(0,i-40),i+80)+'…','sess',s.id])}});
  d.items.forEach(i=>{if(has(i.text)||has(i.src)||has(i.ref))hits.push([STKINDS[i.kind][0],i.text,'topic',i.topic])});
  d.questions.forEach(x=>{if(has(x.text)||has(x.answer))hits.push(['Question',x.text,x.topic?'topic':'',x.topic||''])});
  stNotes().forEach(n=>{if(has(n.text)||has(n.ref))hits.push(['Study note',(n.ref?n.ref+' — ':'')+(n.text||'').slice(0,120),n.topic?'topic':'',n.topic||''])});
  return `<div class="stres">${hits.slice(0,30).map(([k,t,go,id])=>`<button class="mvhrow" ${go?`data-st="${go}" data-id="${esc(id)}"`:''}><span><em class="stbadge note">${esc(k)}</em> ${esc(String(t).slice(0,160))}</span></button>`).join('')||'<p class="empty">No matches.</p>'}</div>`}
// ---------- focused meditation ----------
function stMed(o){ST.med=Object.assign({min:10,start:0,dur:0,thought:''},o);stMedPaint()}
function stMedPaint(){let sh=$('#stmed');if(!sh){sh=document.createElement('div');sh.id='stmed';document.body.appendChild(sh);sh.addEventListener('click',stMedClick);sh.addEventListener('input',e=>{if(e.target.dataset.stmt!=null&&ST.med)ST.med.thought=e.target.value})}
  const M=ST.med;if(!M){sh.className='hide';sh.innerHTML='';return}const run=M.start&&!M.over,left=run?M.start+M.dur*60000-Date.now():M.min*60000;
  sh.className='stmedwrap';sh.innerHTML=`<div class="stmedin" role="dialog" aria-modal="true" aria-label="Focused meditation"><button class="x stmx" data-sm="close" aria-label="Close">×</button>
    <div class="hk">Focused Meditation</div>${M.refs&&M.refs.length?`<h2 class="stmref">${M.refs.map(stLink).join(' · ')}</h2>`:''}${M.material?`<blockquote class="stmmat">${esc(M.material.slice(0,1200))}</blockquote><small class="calnote">Your own notes</small>`:''}
    <p class="stmq">${esc(M.q||'What does this reveal about Jehovah?')}</p>${M.qs&&M.qs.length>1?`<div class="chips" style="justify-content:center">${M.qs.map((q,i)=>`<button class="chip sm" data-sm="q" data-i="${i}" aria-pressed="${q===M.q}">${i+1}</button>`).join('')}</div>`:''}
    <div class="stmtime" data-stclock>${M.over?'Time for a pause':mrClock(left)}</div><small class="calnote">${M.over?'Stretch, breathe, or keep going if you’d like.':run?'Reflection time remaining':'Suggested reflection period'}</small>
    ${M.over?`<div class="chips" style="justify-content:center"><button class="btn" data-sm="more" data-n="5">5 more minutes</button><button class="btn pri" data-sm="done">Finish</button></div>`:run?`<div class="chips" style="justify-content:center"><button class="btn" data-sm="stop">Stop timer</button></div>`:`<div class="seg3 mrdur stmdur" style="max-width:380px;margin:0 auto">${[5,10,15,20].map(n=>`<button data-sm="min" data-n="${n}" aria-pressed="${M.min===n}">${n} min</button>`).join('')}</div><div class="chips" style="justify-content:center;margin-top:10px"><button class="btn pri" data-sm="start">Begin</button><button class="btn" data-sm="notimer">No timer</button></div>`}
    <label class="stmthought"><span class="lbl">Capture a thought (optional)</span><textarea class="write wsm" data-stmt rows="2" placeholder="Anything that comes to mind…">${esc(M.thought||'')}</textarea></label>
    <div class="chips" style="justify-content:center"><button class="chip" data-sm="anchor" aria-pressed="${M.anchor!==false}">${M.anchor!==false?'✓ ':''}Count toward today’s Spiritual anchor</button><button class="btn" data-sm="done">Done</button></div></div>`;
  clearInterval(stMedPaint.t);if(run)stMedPaint.t=setInterval(()=>{const L=M.start+M.dur*60000-Date.now();const el=$('#stmed [data-stclock]');if(L<=0){M.over=true;clearInterval(stMedPaint.t);try{mrChime()}catch(e){}stMedPaint();return}if(el)el.textContent=mrClock(L)},1000)}
function stMedClick(e){const b=e.target.closest('[data-sm]');if(!b)return;const M=ST.med,a=b.dataset.sm;if(!M)return;

// ---------- dates ----------
const WDN=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const WDRE='(sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)(?:day|nesday|sday|urday|rsday)?';
const MONN=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const NUMW={a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10};
const wdIdx=w=>{w=w.toLowerCase().slice(0,3);return ['sun','mon','tue','wed','thu','fri','sat'].indexOf(w)};
function nextWd(base,wd,strictAfter){const b=parse(base);let n=(wd-b.getDay()+7)%7;if(n===0&&strictAfter)n=7;return addDays(base,n)}
function nextDayType(base,types){for(let i=1;i<=60;i++){const d=addDays(base,i);if(types.includes(dayType(d)))return d}return ''}
function capDate(s,base){const low=s.toLowerCase();const r={date:'',time:'',win:'',phrase:[],unclear:'',deadline:false,recur:''};let m;
  const take=re=>{const mm=low.match(re);if(mm){r.phrase.push(mm[0]);return mm}return null};
  if(take(/\b(every|each)\s+(day|morning|night|evening|week|weekday|weekend|month|sunday|monday|tuesday|wednesday|thursday|friday|saturday)s?\b|\b(daily|weekly|monthly)\b/))r.recur=r.phrase[r.phrase.length-1];
  if(/\bby\b/.test(low))r.deadline=true;
  if(take(/\bday after tomorrow\b/))r.date=addDays(base,2);
  else if((m=take(/\btomorrow(\s+(morning|afternoon|evening|night))?\b/))){r.date=addDays(base,1);if(m[2])r.win=m[2]==='night'?'evening':m[2]}
  else if((m=take(/\b(tonight|this (morning|afternoon|evening)|today|when i get home|later today)\b/))){r.date=base;if(m[1]==='tonight'||m[1]==='when i get home')r.win='evening';else if(m[2])r.win=m[2]}
  else if((m=take(/\bin\s+(\d+|a|an|one|two|three|four|five|six|seven|eight|nine|ten)\s+(day|days|week|weeks)\b/))){const n=NUMW[m[1]]||Number(m[1]);r.date=addDays(base,/week/.test(m[2])?n*7:n)}
  else if(take(/\b(this|next) weekend\b/)){const sat=nextWd(base,6,false);r.date=/next/.test(r.phrase[r.phrase.length-1])&&sat<=addDays(base,6)?addDays(sat,7):sat}
  else if((m=take(new RegExp('\\b(this|next|on|by|before|until|coming)?\\s*'+WDRE+'\\b')))&&!r.recur){const wd=wdIdx(m[2]);if(m[1]==='next'){const thisOne=nextWd(base,wd,true);const mon=monday(base);r.date=thisOne<addDays(mon,7)?addDays(thisOne,7):thisOne}else r.date=nextWd(base,wd,true)}
  else if((m=take(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))){const y=m[3]?(m[3].length===2?2000+Number(m[3]):Number(m[3])):Number(base.slice(0,4));r.date=y+'-'+pad(m[1])+'-'+pad(m[2]);if(r.date<base&&!m[3])r.date=(y+1)+r.date.slice(4)}
  else if((m=take(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?\b/))){const y=Number(base.slice(0,4));r.date=y+'-'+pad(MONN.indexOf(m[1].slice(0,3))+1)+'-'+pad(m[2]);if(r.date<base)r.date=(y+1)+r.date.slice(4)}
  else if(take(/\b(on )?my next day off\b|\bnext day off\b/)){r.date=nextDayType(base,['O','W']);if(!r.date)r.unclear='Next day off isn’t on your schedule yet'}
  else if(take(/\b(on )?my next shift\b|\bnext shift\b/)){r.date=nextDayType(base,['S']);if(!r.date)r.unclear='Next shift isn’t on your schedule yet'}
  else if(take(/\b(next|during my next|at my next|in my next)\s+(session|appointment with my therapist)\b/)){const na=SESSEV&&SESSEV.state==='ok'?SESSEV.events.filter(e=>e.date>=base).sort((a,b)=>a.s<b.s?-1:1)[0]:null;if(na)r.date=na.date;else r.unclear='Next session date isn’t known'}
  else if(take(/\b(next week|soon|later|sometime|when i get a chance|before the meeting|after the meeting|this week|end of the week)\b/)){r.unclear='“'+r.phrase[r.phrase.length-1]+'” — no exact date'}
  // times: only when clear (am/pm, 24h, noon/midnight)
  if((m=take(/\b(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)/))){let h=Number(m[1])%12;if(/p/.test(m[3]))h+=12;r.time=pad(h)+':'+(m[2]||'00')}
  else if((m=take(/\b(?:at\s+)?([01]?\d|2[0-3]):([0-5]\d)\b/))){r.time=pad(m[1])+':'+m[2]}
  else if((m=take(/\b(?:at\s+)?(noon|midnight)\b/))){r.time=m[1]==='noon'?'12:00':'00:00'}
  else if((m=low.match(/\bat\s+(\d{1,2})\b(?!\s*(?:am|pm|:))/))){r.unclear=(r.unclear?r.unclear+' · ':'')+'Time “at '+m[1]+'” — am or pm?'}
  if(!r.win&&(m=low.match(/\b(morning|afternoon|evening)\b/)))r.win=m[1];
  if(r.time&&!r.win){const h=Number(r.time.slice(0,2));r.win=h<8?'early':h<12?'morning':h<17?'afternoon':'evening'}
  return r}

      if(c.reflect&&!(isLast&&node.kids.length)){if(ctx.kind==='inbox'||ctx.kind==='dump'){const {it}=mk(s,s,'reflection',{dest:'journal',cat:'journal',group:'Journal',date:'',conf:'medium'});out.push(it)}else kept.push({s,why:'reflection'});return}

function capApply1(items,ctx){const created=[],td=today(),srcRef={kind:ctx.kind,key:ctx.key||'',id:ctx.id||'',date:ctx.date||td,text:ctx.kind==='inbox'?(ctx.text||'').slice(0,400):''};

function capUndo(created){(created||[]).forEach(c=>{

  else if(c.type==='studyq'){const sd=stDoc(),i=sd.questions.findIndex(x=>x.id===c.id);if(i>=0){tomb(sd,c.id);sd.questions.splice(i,1);save('study')}}
  else if(c.type==='quote'){const b=get('quotes',{items:[]}),i=(b.items||[]).findIndex(x=>x.id===c.id);if(i>=0){tomb(b,c.id);b.items.splice(i,1);save('quotes')}}

  else if(c.type==='reg'){const r=get('capture',{items:[]}),i=r.items.findIndex(x=>x.id===c.id);if(i>=0){tomb(r,c.id);r.items.splice(i,1);save('capture')}}})}

    <div class="qadd"><input id="qnew" placeholder="Add a question" aria-label="New question"><button class="btn" data-act="qadd">Add</button></div>

    <div id="pastbody">${pastHTML()}</div>`,false)}

}
function vHelp(){
  const sec=(t,b,open)=>`<details ${open?'open':''}><summary>${t}</summary><div class="body">${b}</div></details>`;
  const local=!window.claude;
  return `<div class="card help">
  ${sec('The idea',`<p>Write as much or as little as you want. <b>One line is a full entry.</b> Gaps between days are normal, and nothing here is required.</p><p>Each entry can carry one of four categories (Spiritual, Movement, Journal, Reset). Picking one ticks that anchor for the day. The ticks are a quiet record, not a score.</p>`,true)}
  ${sec('Today and Journal',`<p><b>Today</b> is your planner: <b>Day</b> (plan, schedule, tasks) plus <b>Tasks</b>, <b>Week</b> and <b>Month</b>. <b>Journal</b> is for writing:</p><ol><li>Write in the lined space. Add a title and pick a category (Spiritual, Movement, Journal or Reset) if you like, then tap <b>Save entry</b>. The category shows on the folded entry and ticks that anchor for the day. The entry folds up into one line so the page stays tidy.</li><li>Tap <b>+ New entry</b> to write about something else. A day can hold as many entries as you want.</li><li>Tap any saved entry to open it, read it or edit it, then tap <b>Done</b> to fold it back up. Unsaved writing stays as a draft until you come back.</li><li>Stuck? Tap <b>Need a prompt?</b> Tap <b>Another</b> for a different one.</li><li><b>Details</b> (closed by default) holds sleep, workout, run, and ministry. Open it only if you want the numbers.</li><li>Use <b>‹ ›</b> at the top to move between days.</li><li><b>Also written this day</b> lists study notes and session notes from that date. They stay in Spiritual and Sessions; tap one to open it there.</li><li><b>All entries</b> at the bottom lists every day with writing, ticks, study notes or sessions.</li></ol>`)}
  ${sec('Workouts',`<ol><li>Open <b>Details → Workout</b>.</li><li>Tap a template (Upper A, Station A, Gym B…) to fill in the exercises, or <b>+ Exercise</b>.</li><li>Add sets × reps and weight.</li><li>For a run or bike, pick the type and enter miles and time. Pace fills in for you.</li></ol><p>Everything you log shows up in <b>Setup → Open logs</b>.</p>`)}
  ${sec('Planner',`<p><b>On Today</b>, the Plan card has:</p><ul><li><b>Day type</b> (L, W, S, B, O). It's set from your schedule in Setup. Tap a letter to change just that day.</li><li><b>Top 3:</b> the three things that matter most. Tick them off.</li><li><b>Today’s schedule:</b> your routine (daily text, Bible reading, workout, focus block…) and ${window.claude?'your Google Calendar events ':''}in one time-ordered list, each with a checkbox. The routine for that day's type fills in by itself each day, grouped into windows (Early morning, Morning, Afternoon, Evening, Anytime). Tap the arrows on an item to move it to another part of the day.</li><li><b>Spiritual plan, spread across the week:</b> daily text, Bible reading, and time to meditate and write personal notes every morning. Bible reading follows the jw.org Bible Reading Schedule, one reading at a time: the whole Bible, or just the red-diamond (historical overview) or blue-dot (Christian congregation) readings, chosen in Setup → Schedule. It shows under Bible reading and only moves forward when you check it off, so a missed day simply picks up where you left off. Tap <b>Write notes</b> under Meditate to open a notes box. Your notes collect on the Spiritual tab under Study notes. plus one study item a day: Mon finish midweek prep · Tue midweek meeting · Wed personal study · Thu Watchtower prep (first half) · Fri Watchtower prep (second half) + field service meeting prep · Sat start midweek prep · Sun field service + weekend meeting. On a shift day the prep moves to the next day. Routine items have no clock times unless you turn on <b>Exact times</b> in Setup → Schedule, so nothing is ever “late.” All-day calendar items (like Daily Text) can be checked off too. If your calendar already has an item with the same name (like “Daily Text”), only the calendar one shows, so nothing appears twice. Edit times and names, add items, or remove them. The bar shows how much is done, and Week shows it for every day.${window.claude?' Tap the <b>calendar button</b> on a block to add it to Google Calendar.':''}</li><li><b>Tasks</b> due that day. Unfinished tasks from earlier days show as <b>Carried over</b>, with <b>Move all to today</b>.</li></ul><p><b>Today tab views:</b></p><ul><li><b>Tasks:</b> add with or without a date. No date puts it in your Inbox. Change a task's date to reschedule it. <b>Import tasks</b> brings in a pasted list (one per line, dates picked up) or a Google Tasks export from takeout.google.com.</li><li><b>Week:</b> each day's type, anchor ticks, Top 3, tasks${window.claude?' and calendar events':''}. With the shift cycle on, switch to the 15-day cycle view. Your weekly check-in is below.</li><li><b>Month:</b> a calendar grid. Tap a day to see its events, tasks and journal entry${window.claude?', or <b>+ Add event</b>':''}.</li></ul><p>Use <b>‹ ›</b> at the top to move between weeks, cycles, or months.</p>`)}
  ${sec('Spiritual',`<p>The <b>Spiritual</b> tab gathers everything spiritual for a day (use ‹ › to change days):</p><ul><li><b>Activities:</b> daily text, Bible reading, meditation, meeting prep, meetings and field service from your routine${window.claude?' and calendar':''}. Check them off here or on Today; they stay in sync. Add extra activities like family worship or research.</li><li><b>Bible reading:</b> your next reading from the schedule, <b>Mark as read</b>, progress, and under <b>Track, place and history</b> the red-diamond and blue-dot tracks, Set my place, and recent readings.</li><li><b>Study notes:</b> tap <b>+ New note</b>, choose Bible reading, Personal study, Meeting prep, Research or Other, add the scripture or topic, and write. Filter by type or search. Tap a note to edit it.</li></ul>`)}
  ${window.claude?'':sec('Google connection',`<p>The home-screen app can use your Google Calendar and back up to Google Drive through a small script that runs in your own Google account.</p><ol><li>On a computer, go to <b>script.google.com</b> → <b>New project</b>. Paste in the <b>KL Journal bridge</b> script (Code.gs) and save.</li><li>Choose <b>setup</b> in the toolbar and tap <b>Run</b>. Allow access. If Google says the app isn't verified, tap <b>Advanced → Go to KL Journal bridge</b>.</li><li><b>Deploy → New deployment</b> → gear → <b>Web app</b>. Execute as <b>Me</b>, access <b>Anyone</b>. Deploy and copy the Web app URL.</li><li>Here, open <b>More → Google connection</b>, paste the URL and the secret key from the top of the script, and tap <b>Connect</b>.</li></ol><p>Your journal saves to the phone first and copies to Drive a few seconds later, so it works without signal and catches up when you're back online.</p>`)}
  ${sec('Smart Capture',`<p><b>From Thought to Action.</b> Write naturally; Smart Capture finds the tasks, dates, appointments, spiritual activities, workouts and session questions in what you wrote, and suggests where each belongs.</p><ul><li>Tap <b>✦ Organize</b> (or <b>Save &amp; Organize</b>) on a journal entry, study note, session notes, an Inbox note or the + capture.</li><li>Check what to add. You can change the title, where it goes, the type, date, time and priority first.</li><li>It skips things you already did, things you don't need to do, and “maybe” thoughts. Feelings and reflections stay in your note.</li><li>Dates like <i>tomorrow morning</i>, <i>this Friday</i>, <i>next Tuesday</i>, <i>in two weeks</i>, <i>on my next day off</i> or <i>every Monday</i> are understood. If a date or time is unclear, it's left blank for you to choose.</li><li>It won't add the same thing twice, and offers to update an existing task instead. Your original note never changes; tasks it creates show <b>From Journal entry</b> (or wherever) in their details so you can jump back.</li><li><b>Undo</b> appears after anything is added. Modes (Review first, Smart Auto, Manual) are in <b>More → Smart Capture</b>.</li><li>Everything is read on this device. Nothing is sent anywhere.</li></ul>`)}
  ${sec('Daily Perspective',`<p>Each day the top of <b>Home</b> shows one short perspective on discipline, purpose, resilience, leadership, balance, growth, emotional well-being, patience, self-awareness or consistency. It stays the same all day on every device and changes after midnight. You'll see all 445 before any repeats.</p><ul><li><b>☆ Save</b> keeps it. Find saved ones under <b>More → Saved perspectives</b>.</li><li><b>Share</b> opens your phone's share sheet, or copies the quote.</li><li><b>Reflect on this</b> starts a journal entry with the quote as its title.</li></ul>`)}
  ${sec('Home',`<p><b>Home</b> is organized around what matters today: your <b>Daily Perspective</b>, <b>My Daily Anchors</b> (tap Spiritual, Movement, Journal or Reset when you've done it), <b>Today’s Top 3</b>, and <b>Write a Quick Entry</b>. Below that, <b>Today at a glance</b> and <b>This week</b> open for the fuller picture: routine progress, tasks, Bible, journal, sessions, and your anchors across the week.</p>`)}
  ${sec('Letting the journal prioritize',`<p>When it feels like too much, let the journal choose.</p><ul><li><b>Top 3 fills itself.</b> Each morning, empty Top 3 spots fill with your most pressing tasks: overdue and due soon first, then ★ important, then quick wins. Tasks with no date rise the longer they wait.</li><li><b>It matches your day.</b> Shift days get 1 pick, between days 2, other days 3. A <b>Flex day</b> gets 1.</li><li><b>Start here</b> at the top of Today shows just the one next thing, with its next step and when you're done. <b>Not today</b> swaps in the next pick.</li><li>Empty spots you leave are yours to type in. <b>+ Pick one more for me</b> adds another when you have room. Turn the auto-pick off in More if you want.</li><li>In Tasks, <b>Do next</b> lists everything in that same order. Open a task with ⋯ to add a next step, a "done when," or mark it ★ important or quick.</li></ul>`)}
  ${sec('Inbox and Flex day',`<p>Tap the gold <b>+</b> on any screen to jot down whatever's on your mind. You can add several in a row. Sort them later from the Inbox card on Today: a task for today, a task for later, a journal entry, a study note, or delete.</p><p><b>Flex day</b> (on the Plan card) is for days that went sideways on purpose: a call-out, a sick kid, a convention. Unchecked items fade and count as skipped, not missed.</p>`)}
  ${sec('Bible reading schedule',`<p>On <b>Spiritual</b>, tap <b>Full schedule</b> to see every reading on the jw.org schedule, grouped by book.</p><ul><li>Tap a box to mark a reading done. Today's date fills in; tap the date to change it.</li><li><span style="color:#e0574b">◆</span> marks the historical track and <span style="color:#4aa8e0">●</span> the chronological track. Use the filters to show one track or only what you haven't read.</li><li>Type a book name in <b>Jump to a book</b> to scroll straight to it.</li><li>The seal and ribbon at the top show how much of the Bible you've read.</li><li>Your daily reading on Today follows this list and skips anything you've already checked. <b>Clear all progress</b> starts over (tap twice).</li></ul>`)}
  ${sec('Entries',`<p><b>Entries</b> lists every day you wrote or ticked something. Tap one to open it.</p>`)}
  ${sec('Sessions (therapy notes)',`<ol><li><b>Questions for next time:</b> add questions as they come up during the week. Tick them once you've asked. <b>Clear asked questions</b> tidies the list.</li><li><b>New session:</b> the date is filled in. Change it to write up an earlier session.</li><li>Answer any of the three short prompts, or skip them.</li><li><b>Free write:</b> as much detail and context as you want.</li><li><b>Past sessions:</b> tap one to open it again.</li></ol><p>Sessions are private. Only you can see them.</p>`)}
  ${window.claude?sec('Calendar',`<p>The <b>On the calendar</b> card at the top of Today shows that day’s Google Calendar events, including past days. Choose which calendars appear in <b>Setup → Calendars</b>. It refreshes by itself every couple of minutes and whenever you come back to the journal. New calendars, including ones shared with you, appear within a few minutes, or right away when you tap ↻. Tap <b>↻</b> to pull the latest right away.</p><p>Calendars you subscribe to in Google (like iCloud calendars) only update as often as Google refreshes them, usually every few hours.</p><p>On <b>Sessions</b>, add the words your therapy appointments use (several are fine, like “therapy,” “counseling,” or your therapist’s name). Any appointment matching any word shows up: recent ones with <b>Start notes</b> or <b>Open notes</b>, plus your next one. Appointments you haven’t written up appear in Past sessions as “no notes yet.” The appointment time and name fill in at the top of the session automatically.</p><p>The journal only reads your calendar. It never changes it.</p>`):''}
  ${sec('Voice typing',`<p>Tap into any writing space, then tap the <b>🎤 microphone on your keyboard</b> and talk. Say "period," "comma," or "new paragraph" for punctuation.</p><p>iPhone: turn it on once in Settings → General → Keyboard → Enable Dictation.</p>`)}
  ${sec('Recordings and transcripts',`<ul>${local?'<li><b>Record:</b> tap Record, talk, tap Stop. The clip is saved to this entry.</li>':''}<li><b>Attach recording:</b> pick a Voice Memo from your phone.${local?'':' Clips up to 20 MB (about 20–40 minutes).'}</li><li><b>Transcript:</b> paste the text under the clip, then tap <b>Add transcript to free write</b> to put it into your entry.</li>${local?'<li><b>Paste transcript:</b> pastes whatever you copied straight into your free write.</li>':''}</ul><p><b>Getting a transcript from Voice Memos:</b> open the recording, tap the waveform (or quote) icon, select the text, tap Copy, then paste it into the journal.</p>`)}
  ${sec('The KL Voice shortcut',`<p>A Shortcuts button that listens, turns your voice into text, and copies it.</p><ol><li>In the Shortcuts app, tap <b>+</b> and add: <b>Dictate Text</b> (Stop Listening: On Tap) → <b>Copy to Clipboard</b> → <b>Show Notification</b>.</li><li>Name it <b>KL Voice</b> and add it to your Home Screen.</li><li>Tap it, talk, then tap to stop.</li><li>Open the journal and ${local?'tap <b>Paste transcript</b>':'press and hold in the writing space, then tap <b>Paste</b>'}.</li></ol><p>A shortcut can copy text but can't type into the journal by itself, so the paste is the last step.</p>`)}
  ${sec('Home screen icon',`${local?'<p>This is the home screen app. Your entries and recordings stay on this phone.</p>':'<p>To get the KL icon instead of Claude’s: in Shortcuts, make a shortcut with <b>Open URLs</b> and this journal’s link, then Share → <b>Add to Home Screen</b> → tap the icon → <b>Choose Photo</b> → pick the KL image.</p>'}`)}
  ${sec('Backups and privacy',`<p>${local?'Your journal is saved on this phone only. <b>Setup → Backup → Download backup</b> once a month. Deleting the app erases its entries and recordings. Recordings are not in the backup file.':'Your journal saves to a private area of your Claude account and follows you to any device. A downloaded backup once a month is still a good idea. Recordings stay in your account.'}</p><p><b>Import backup</b> moves your entries between the claude.ai journal and the home screen app.</p>`)}
  ${sec('If something seems off',`<ul><li><b>"Can't reach your journal yet"</b>: check your connection. Changes save when it reconnects.</li><li><b>Record button missing:</b> recording works in the home screen app. On claude.ai, attach a Voice Memo instead.</li><li><b>Transcript is cut off:</b> use Voice Memos' built-in transcript for long recordings.</li></ul>`)}
  </div><p class="rem">This journal is a tool, not a test.</p>`;
}

  if(b.dataset.cs==='close'){CAPS=null;capSheet();return}

// ---------- backup ----------
function backupJSON(){const o={};Object.keys(cache).forEach(k=>{o[k]=cache[k]});return JSON.stringify({app:'anchors-journal',v:1,exported:new Date().toISOString(),data:o},null,1)}
async function exportData(){
  const name='kl-journal-backup-'+today()+'.json',o=JSON.parse(backupJSON());try{o.images=await vcBackupImages()}catch(e){}const data=JSON.stringify(o);
  try{const dl=window.claude?await claude.use('downloads'):null;if(dl){await dl.save({filename:name,data});return}}catch(e){if(e&&e.code)return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
}
let pendingImp=null;
function readImport(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);const d=j.data||j;const keys=Object.keys(d).filter(k=>/^(day|week|progress|session)-\d{4}-\d{2}-\d{2}$|^(settings|sessq|tasks|pushups|movement|images|quotes|inbox|capture|mreset|study)$|^note-[a-z0-9]+$/.test(k)&&d[k]&&typeof d[k]==='object');
  const imgs=j.images&&typeof j.images==='object'?j.images:null,ni=imgs?Object.keys(imgs).length:0;if(!keys.length)throw 0;pendingImp={d,keys,imgs};$('#impMsg').innerHTML=`<div class="note">Import ${keys.length} entries${ni?' and '+ni+' photo'+(ni>1?'s':''):''}? Entries with the same date are replaced. <div class="chips" style="margin-top:8px"><button class="btn sm pri" data-act="doimp">Import</button><button class="btn sm" data-act="noimp">Cancel</button></div></div>`}
  catch(e){$('#impMsg').innerHTML='<div class="note">That file isn’t an Anchors backup.</div>'}};r.readAsText(file)}
async function doImport(){if(!pendingImp)return;const {d,keys,imgs}=pendingImp;pendingImp=null;$('#impMsg').innerHTML='<div class="note">Importing…</div>';
  for(const k of keys){cache[k]=d[k];if(mode==='remote'){try{await remote.doc(k).set(d[k])}catch(e){$('#impMsg').innerHTML='<div class="note">Import stopped part-way — try again.</div>';return}}}
  if(mode!=='remote'){const t=Date.now();keys.forEach(k=>{if(cache[k]&&typeof cache[k]==='object')cache[k]._u=t;driveQueue(k)});lsSave()}let ni=0;if(imgs){$('#impMsg').innerHTML='<div class="note">Restoring photos…</div>';ni=await vcRestoreImages(imgs)}$('#impMsg').innerHTML=`<div class="note">Imported ${keys.length} entries${ni?' and '+ni+' photo'+(ni>1?'s':''):''}.</div>`}

// ---------- startup ----------
function useLocal(msg){mode='local';Object.assign(cache,lsLoad());READY=true;setStatus(msg||(driveOn()?'Checking Google Drive…':'Saved on this device'));render();if(driveOn()){drivePull();setInterval(drivePull,300000)}}
async function start(){
  render();
  if(!window.claude||typeof claude.use!=='function'){useLocal();return}
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    const uid=user?await user.id():null;
    if(!db||!uid){useLocal('Saving on this device only');return}
    remote=db.collection('data/users/'+uid);mode='remote';
    let timer=setTimeout(()=>setStatus('Can’t reach your journal yet — changes will save when it connects',true),10000);
    remote.onSnapshot(snap=>{
      if(!snap.metadata.fromCache){clearTimeout(timer);if(!dirty.size)setStatus('Saved');if(!READY){READY=true;touchedReady=true}}
      let touchedCurrent=false;var touchedReady=touchedReady||false;
      snap.docChanges().forEach(ch=>{const k=ch.doc.id;if(dirty.has(k))return;
        if(ch.type==='removed')delete cache[k];else cache[k]=JSON.parse(JSON.stringify(ch.doc.data()));
        if(k==='day-'+S.date||k==='week-'+S.week||S.tab!=='today')touchedCurrent=true});
      const busy=document.activeElement&&main.contains(document.activeElement)&&/INPUT|TEXTAREA/.test(document.activeElement.tagName);
      if((touchedCurrent||touchedReady)&&!busy){const y=scrollY;render();scrollTo(0,y)}
    },err=>{clearTimeout(timer);setStatus('Lost connection — reload the page to keep saving',true)});
  }catch(e){useLocal('Saving on this device only')}
}
start();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

}
